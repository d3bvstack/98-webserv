; Vhost configuration
[vhost.start]
    server_name = example.com www.example.com 127.0.0.1:9898 ; Domain name
    host = 127.0.0.1                    ; IPv4 address the vhost binds to
    listen = 9898                       ; Port the vhost listens from
    max_body_size = 1048576             ; Max body size for this vhost
    keep_alive_timeout = 10             ; Idle timeout in seconds (default: 60)
    error_page = 404 ./www/example.com/errors/404.html  ; Custom error pages for this vhost
    error_page = 500 ./www/example.com/errors/500.html
    error_page = 403 ./www/example.com/errors/403.html
    cgi  = .py	/usr/bin/python3	    ; Extension mapped to interpreter or executable that will run the reuqested file    ;
    cgi  = .sh  /usr/bin/sh
    cgi  = .php  /usr/bin/php-cgi
    cgi  = .cgi                         ; Direct execution (no interpreter) for compiled programs

    ; Root location
    [location.start]
        path = /                        ; Path to match
        root = ./www/example.com/public ; Folder in which to look for files (root+path)
        methods = GET                   ; Allowed request methods on the routes encompassed by this location block
        default = index index.html index.htm  ; Default files to serve when a directory is requested without specific file request
    [location.end]

    ; CGI location
    [location.start]
        path = /cgi-bin                  ; Path to match
        root = ./www/example.com/cgi-bin ; Folder in which to look for files (root+path)
        methods = GET POST               ; Allowed request methods on the routes encompassed by this location block
    [location.end]

    ; Uploading
    [location.start]
        path = /files                   ; Path to match
        root = ./www/example.com/files	; Folder in which to look for files (root+path)
        methods = GET POST              ; Only allow GET for directory listings
        max_body_size = 10              ; Max body size for this vhost
        upload_store = ./www/example.com/files/uploads  ; Allow uploads in routes encompassed by this location block
        default = index index.html index.htm  ; Default files to serve when a directory is requested without specific file request
    [location.end]

    ; Directory listing
    [location.start]
        path = /files/uploads           ; Path to match
        root = ./www/example.com/files/uploads ; Folder in which to look for files (root+path)
        methods = GET DELETE            ; Only allow GET for directory listings
        autoindex = true                ; Generate a directory listing when no default file is present
    [location.end]

    ; Redirection
    [location.start]
        path = /old/page                ; Path to match
        return = 308 /                  ; Redirection code and file to serve instead of path
    [location.end]
[vhost.end]
